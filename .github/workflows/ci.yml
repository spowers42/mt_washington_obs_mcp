name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src/mt_washington_mcp/
