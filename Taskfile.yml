# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Run the MCP server
    cmds:
      - fastmcp run src/mt_washington_mcp/server.py:mcp

  test:
    desc: Run the test suite
    cmds:
      - uv run pytest tests/ -v

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check src/ tests/

  lint-fix:
    desc: Auto-fix lint issues with ruff
    cmds:
      - uv run ruff check --fix src/ tests/

  typecheck:
    desc: Run mypy type checker
    cmds:
      - uv run mypy src/

  check:
    desc: Run lint, typecheck, and tests
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  inspect:
    desc: Inspect the MCP server
    cmds:
      - fastmcp inspect src/mt_washington_mcp/server.py:mcp
  
