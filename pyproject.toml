[project]
name = "mt-washington-obs-mcp"
version = "0.1.0"
description = "MCP server for Mt Washington Observatory weather data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.28.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
mtw-obs-mcp = "mt_washington_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt_washington_mcp"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pytest",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[tool.mypy]
python_version = "3.14"
